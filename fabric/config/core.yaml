    rootcert:
      file: /home-errick/fabric/crypto-config/ordererOrganizations/dao-vc.ir/orderers/orderer3.dao-vc.ir/tls/ca.crt

bccsp:
  default: SW
  SW:
    Hash: SHA2
    Security: 256
    FileKeyStore:
      KeyStore: /home-errick/fabric/crypto-config/peerOrganizations/vc1.dao-vc.ir/peers/peer0.vc1.dao-vc.ir/msp/keystore

chaincode:
  golang:
    runtime: golang:1.12-alpine
  install:
    timeout: 300s
  start:
    timeout: 300s

logging:
  level: info
  format: "%{color}%{time:15:04:05.000} %{shortfile} %{shortfunc} -> %{level:.4s} %{id:03x} %{message}%{color:reset}"
  peer:
    level: debug
  cauthdsl:
    level: debug
  gossip:
    level: debug
  ledger:
    level: info
  msp:
    level: info
  policies:
    level: debug
  grpc:
    level: info

gossip:
  bootstrap: peer0.vc1.dao-vc.ir:7052
  useLeaderElection: true
  orgLeader: false
  endpoint: peer0.vc1.dao-vc.ir:7052

metrics:
  provider: prometheus
  statsd:
    network: tcp
    address: 127.0.0.1:8125
    writeInterval: 10s
    prefix: fabric

vm:
  endpoint: unix:///var/run/docker.sock
  docker:
    tls:
      enabled: false
  networkMode: host

  <g stroke="#334155" stroke-width="1.5" fill="none">
    <line x1="172" y1="98" x2="172" y2="182" marker-end="url(#arrow)"/>
    <line x1="402" y1="98" x2="389" y2="182" marker-end="url(#arrow)"/>
    <line x1="632" y1="98" x2="630" y2="182" marker-end="url(#arrow)"/>
    <line x1="855" y1="98" x2="846" y2="182" marker-end="url(#arrow)"/>


  <g fill="none">
    <path d="M 492 285 L 512 285 L 512 326 L 738 326 L 738 285 L 745 285" stroke="#0284c7" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  </g>
  <g>
    <rect x="562" y="318" width="144" height="17" rx="3.5" fill="#ffffff" stroke="#0284c7" stroke-width="0.9"/>
    <text x="634" y="330.5" font-size="10.5" font-weight="bold" fill="#0284c7" text-anchor="middle">Verified Anomaly B(u)</text>
  </g>

  <g font-size="10" font-weight="600" fill="#0369a1" text-anchor="middle">
    <rect x="335" y="349" width="105" height="16" fill="#ffffff" rx="3" stroke="#0284c7" stroke-width="0.7"/>
    <text x="387" y="361">Attested Risk R(p)</text>
  </g>

  <!-- Feedback Loops -->
  <g stroke="#0284c7" stroke-width="1.4" stroke-dasharray="5,4" fill="none">
    <path d="M 662 471 L 662 510 L 25 510 L 25 70 L 65 70" marker-end="url(#arrow-blue)"/>
  </g>
  <rect x="290" y="502" width="160" height="16" fill="#ffffff" rx="3" stroke="#0284c7" stroke-width="0.8"/>
  <text x="370" y="514" font-size="10.5" font-weight="bold" fill="#0284c7" text-anchor="middle">↺ Telemetry Feedback Loop</text>

  <g stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,4" fill="none">
    <path d="M 870 471 L 870 500 L 995 500 L 995 70 L 955 70" marker-end="url(#arrow-red)"/>
  </g>
  <rect x="875" y="492" width="130" height="16" fill="#ffffff" rx="3" stroke="#dc2626" stroke-width="0.8"/>
  <text x="940" y="504" font-size="10.5" font-weight="bold" fill="#dc2626" text-anchor="middle">↺ Escrow State Update</text>
</svg>
<svg id="aipox-svg" viewBox="0 0 1020 545" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- ================= TIER 1 ================= -->
  <g id="tier1">
    <rect x="50" y="15" width="920" height="92" rx="6" fill="#fff5f7" stroke="#9d174d" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="65" y="32" font-size="12" font-weight="bold" fill="#831843">1. System Inputs &amp; Escrow Collateral</text>
    
    <rect x="65" y="40" width="215" height="58" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.2"/>
    <text x="172" y="57" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111827">Node Telemetry Vector</text>
    <text x="172" y="73" font-size="12" font-style="italic" text-anchor="middle" fill="#1f2937">z<tspan dy="3" font-size="9">u</tspan><tspan dy="-3"> ∈ ℝ³</tspan></text>
    <text x="172" y="88" font-size="10" text-anchor="middle" fill="#4b5563">(Txs, Gas, Native Balance)</text>

    <rect x="295" y="40" width="215" height="58" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.2"/>
    <text x="402" y="57" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111827">Venture Feature Vector</text>
    <text x="402" y="73" font-size="12" font-style="italic" text-anchor="middle" fill="#1f2937">X<tspan dy="3" font-size="9">p</tspan><tspan dy="-3"> ∈ ℝ⁶</tspan></text>
    <text x="402" y="88" font-size="10" text-anchor="middle" fill="#4b5563">(TAM, Burn, Milestones, Team)</text>

    <rect x="525" y="40" width="215" height="58" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.2"/>
    <text x="632" y="57" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111827">Participant Telemetry</text>
    <text x="632" y="73" font-size="12" text-anchor="middle" fill="#1f2937"><tspan font-style="italic">T<tspan dy="3" font-size="9">u</tspan></tspan><tspan dy="-3"> (Stakes) &amp; </tspan><tspan font-style="italic">P<tspan dy="3" font-size="9">u</tspan></tspan><tspan dy="-3"> (Logs)</tspan></text>
    <text x="632" y="88" font-size="10" text-anchor="middle" fill="#4b5563">(Identity &amp; Voting History)</text>

    <rect x="755" y="40" width="200" height="58" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.2"/>
    <text x="855" y="57" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#111827">Validator Bonded Stake</text>
    <text x="855" y="73" font-size="12" font-style="italic" text-anchor="middle" fill="#1f2937">B<tspan dy="3" font-size="9">i</tspan><tspan dy="-3"> ≥ B<tspan dy="3" font-size="9">min</tspan></tspan></text>
    <text x="855" y="88" font-size="10" text-anchor="middle" fill="#4b5563">(Slashing Escrow Guarantee)</text>
  </g>

  <!-- ================= TIER 2 ================= -->
  <g id="tier2">
    <rect x="50" y="130" width="920" height="218" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="65" y="148" font-size="12" font-weight="bold" fill="#334155">2. Parallel Off-Chain AI &amp; On-Chain Governance</text>

    <!-- Subgraph 2A: AI Meta-Layer -->
    <rect x="62" y="158" width="440" height="178" rx="5" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="75" y="174" font-size="11.5" font-weight="bold" fill="#0369a1">2A. Off-Chain AI Meta-Layer</text>

    <rect x="72" y="182" width="205" height="56" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/>
    <text x="174" y="198" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Telemetry Autoencoder <tspan font-style="italic">B(u)</tspan></text>
    <text x="174" y="215" font-size="11.5" text-anchor="middle" fill="#1e293b">Loss: ||<tspan font-style="italic">z<tspan dy="3" font-size="8">u</tspan></tspan><tspan dy="-3"> - </tspan><tspan font-style="italic">ẑ<tspan dy="3" font-size="8">u</tspan></tspan><tspan dy="-3">||² / </tspan><tspan font-style="italic">τ<tspan dy="3" font-size="8">norm</tspan></tspan></text>
    <text x="174" y="230" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0284c7">Performance: AUC = 0.992</text>

    <rect x="287" y="182" width="205" height="56" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/>
    <text x="389" y="198" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Venture Risk DNN <tspan font-style="italic">R(p)</tspan></text>
    <text x="389" y="215" font-size="11.5" text-anchor="middle" fill="#1e293b">Prob(Def): 1 - <tspan font-style="italic">P(Solvency)</tspan></text>
    <text x="389" y="230" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0284c7">Performance: AUC = 0.940</text>

    <rect x="72" y="258" width="420" height="55" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="1.3"/>
    <text x="282" y="276" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Threshold Attestation Engine <tspan font-weight="normal">(<tspan font-style="italic">k-of-M</tspan> ECDSA)</tspan></text>
    <text x="282" y="296" font-size="11" font-style="italic" text-anchor="middle" fill="#0369a1">Γ<tspan dy="3" font-size="8">p</tspan><tspan dy="-3"> = Keccak(PropID || R(p) || Epoch || Nonce || ModelHash)</tspan></text>

    <!-- Subgraph 2B: L2 Governance -->
    <rect x="518" y="158" width="440" height="178" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <text x="531" y="174" font-size="11.5" font-weight="bold" fill="#15803d">2B. Layer 2 Deterministic Governance</text>

    <rect x="528" y="182" width="205" height="56" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
    <text x="630" y="198" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Proof of Participation <tspan font-weight="normal">(Eq. 3)</tspan></text>
	<text x="630" y="218" font-size="11.5" font-style="italic" text-anchor="middle" fill="#1e293b">P<tspan dy="3" font-size="8">score,u</tspan><tspan dy="-3"> = W</tspan><tspan dy="3" font-size="8">v</tspan><tspan dy="-3">V</tspan><tspan dy="3" font-size="8">u</tspan><tspan dy="-3"> + W</tspan><tspan dy="3" font-size="8">c</tspan><tspan dy="-3">C</tspan><tspan dy="3" font-size="8">u</tspan><tspan dy="-3"> + W</tspan><tspan dy="3" font-size="8">a</tspan><tspan dy="-3">A</tspan><tspan dy="3" font-size="8">u</tspan></text>

    <rect x="528" y="258" width="205" height="55" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
    <text x="630" y="276" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Convex Voting Power <tspan font-weight="normal">(Eq. 4)</tspan></text>
    <text x="630" y="296" font-size="11.5" font-style="italic" text-anchor="middle" fill="#1e293b">w<tspan dy="3" font-size="8">u</tspan><tspan dy="-3"> = α T̄</tspan><tspan dy="3" font-size="8">u</tspan><tspan dy="-3"> + β P̄</tspan><tspan dy="3" font-size="8">u</tspan><tspan dy="-3">  (β &gt; α)</tspan></text>

    <rect x="745" y="182" width="203" height="131" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
    <text x="846" y="222" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Modified PoA Validator</text>
    <text x="846" y="240" font-size="12" text-anchor="middle" fill="#15803d">Layer (Eq. 2)</text>
    <text x="846" y="268" font-size="12" font-style="italic" text-anchor="middle" fill="#1e293b">W<tspan dy="3" font-size="8">PoA,i</tspan><tspan dy="-3"> = W</tspan><tspan dy="3" font-size="8">A,i</tspan><tspan dy="-3">A</tspan><tspan dy="3" font-size="8">i</tspan><tspan dy="-3"> - δ B(u)</tspan></text>
  </g>

  <!-- ================= TIER 3 ================= -->
  <g id="tier3">
    <rect x="50" y="365" width="920" height="118" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="65" y="382" font-size="12" font-weight="bold" fill="#92400e">3. On-Chain Finality &amp; Smart Contract Settlement</text>

    <rect x="65" y="393" width="215" height="78" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="172" y="415" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Governance Quorum Check</text>
    <text x="172" y="435" font-size="12" font-style="italic" text-anchor="middle" fill="#1e293b">V<tspan dy="3" font-size="8">share</tspan><tspan dy="-3">(p) ≥ θ</tspan></text>
    <text x="172" y="455" font-size="11" text-anchor="middle" fill="#78350f">Token Score: <tspan font-style="italic">V(p)</tspan></text>

    <rect x="295" y="393" width="245" height="78" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="417" y="415" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Macro Treasury Allocation <tspan font-weight="normal">(Eq. 8)</tspan></text>
    <text x="417" y="439" font-size="11.5" font-style="italic" text-anchor="middle" fill="#1e293b">A<tspan dy="3" font-size="8">target</tspan><tspan dy="-3">(p) ∝ V(p) × [(1 - R(p)) / R(p)]</tspan></text>

    <rect x="555" y="393" width="215" height="78" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="662" y="415" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Tranche Disbursement <tspan font-weight="normal">(Eq. 9)</tspan></text>
    <text x="662" y="439" font-size="12" font-style="italic" text-anchor="middle" fill="#1e293b">I(p,t) = A<tspan dy="3" font-size="8">target</tspan><tspan dy="-3">(p) × μ<tspan dy="3" font-size="8">t</tspan><tspan dy="-3"> × S(p,t)</tspan></tspan></text>

    <rect x="785" y="393" width="170" height="78" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="870" y="415" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">PoA Enforcement</text>
    <text x="870" y="432" font-size="11" text-anchor="middle" fill="#b91c1c">(Eq. 11)</text>
    <text x="870" y="452" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#7f1d1d">If B(u) &gt; 0.65 → Slash B<tspan dy="2" font-size="8">i</tspan></text>
  </g>


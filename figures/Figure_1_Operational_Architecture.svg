<svg id="aipox-fig1" viewBox="0 0 1020 520" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- ================= TIER 1 ================= -->
  <g id="tier1">
    <rect x="45" y="15" width="930" height="92" rx="6" fill="#fff5f7" stroke="#9d174d" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="60" y="32" font-size="12" font-weight="bold" fill="#831843">1. System Inputs and Escrow Collateral</text>
    
    <rect x="60" y="40" width="215" height="58" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.2"/>
    <text x="167" y="57" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">Node Telemetry Vector</text>
    <text x="167" y="73" font-size="11.5" font-style="italic" text-anchor="middle" fill="#1f2937">z_u ∈ ℝ⁸</text>
    <text x="167" y="88" font-size="10" text-anchor="middle" fill="#4b5563">8 standardised features</text>

    <rect x="290" y="40" width="215" height="58" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.2"/>
    <text x="397" y="57" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">Venture Feature Vector</text>
    <text x="397" y="73" font-size="11.5" font-style="italic" text-anchor="middle" fill="#1f2937">X_p ∈ ℝ⁶</text>
    <text x="397" y="88" font-size="9.5" text-anchor="middle" fill="#4b5563">burn, request, milestones, team, funding, TAM</text>

    <rect x="520" y="40" width="215" height="58" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.2"/>
    <text x="627" y="57" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">Voter Registry</text>
    <text x="627" y="73" font-size="11.5" text-anchor="middle" fill="#1f2937">T_u (tokens), P_score,u (bps)</text>
    <text x="627" y="88" font-size="10" text-anchor="middle" fill="#4b5563">P_score,u ∈ [0,1] from registry</text>

    <rect x="750" y="40" width="210" height="58" rx="4" fill="#fce7f3" stroke="#be185d" stroke-width="1.2"/>
    <text x="855" y="57" font-size="12" font-weight="bold" text-anchor="middle" fill="#111827">Validator Bonded Stake</text>
    <text x="855" y="73" font-size="11.5" font-style="italic" text-anchor="middle" fill="#1f2937">B_i ≥ B_min</text>
    <text x="855" y="88" font-size="10" text-anchor="middle" fill="#4b5563">slashing escrow</text>
  </g>

  <!-- ================= TIER 2 ================= -->
  <g id="tier2">
    <rect x="45" y="125" width="930" height="205" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
    <text x="60" y="142" font-size="12" font-weight="bold" fill="#334155">2. Off-Chain AI and On-Chain Governance</text>

    <!-- Subgraph 2A: AI Meta-Layer -->
    <rect x="58" y="152" width="422" height="165" rx="5" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.2"/>
    <text x="70" y="168" font-size="11.5" font-weight="bold" fill="#0369a1">2A. Off-Chain AI Meta-Layer</text>

    <rect x="70" y="176" width="195" height="68" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/>
    <text x="167" y="193" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Telemetry Autoencoder B(u)</text>
    <text x="167" y="210" font-size="10.5" text-anchor="middle" fill="#1e293b">B(u) = min(1, (1/8)||z_u - ẑ_u||²)</text>
    <text x="167" y="224" font-size="10" font-weight="bold" text-anchor="middle" fill="#0284c7">Test ROC-AUC = 1.0000 (simulated)</text>
    <text x="167" y="238" font-size="9.5" text-anchor="middle" fill="#475569">cutoff τ = 0.435854</text>

    <rect x="275" y="176" width="195" height="68" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.2"/>
    <text x="372" y="193" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Venture Risk DNN R(p)</text>
    <text x="372" y="210" font-size="10.5" text-anchor="middle" fill="#1e293b">R(p) = P(default | X_p)</text>
    <text x="372" y="224" font-size="10" font-weight="bold" text-anchor="middle" fill="#0284c7">Test ROC-AUC = 0.6394</text>
    <text x="372" y="238" font-size="9.5" text-anchor="middle" fill="#475569">synthetic cohort</text>

    <rect x="70" y="252" width="400" height="55" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="1.3"/>
    <text x="270" y="271" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Threshold Attestation Engine (k-of-M ECDSA)</text>
    <text x="270" y="287" font-size="9" font-style="italic" text-anchor="middle" fill="#0369a1">Γ_p = Keccak-256(contract || chainId || pid || epoch || nonce || ModelHash || riskScaled)</text>
    <text x="270" y="300" font-size="10" text-anchor="middle" fill="#0369a1">Eq. (9); k = 4 of M = 5</text>

    <!-- Subgraph 2B: L2 Governance -->
    <rect x="495" y="152" width="468" height="165" rx="5" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
    <text x="508" y="168" font-size="11.5" font-weight="bold" fill="#15803d">2B. Layer 2 Deterministic Governance</text>

    <rect x="505" y="176" width="200" height="58" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
    <text x="605" y="194" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Participation Score</text>
    <text x="605" y="212" font-size="11" font-style="italic" text-anchor="middle" fill="#1e293b">P̄_u = P_score,u / ∑ P_score,k</text>
    <text x="605" y="227" font-size="10.5" text-anchor="middle" fill="#15803d">Eq. (2)</text>

    <rect x="505" y="242" width="200" height="65" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
    <text x="605" y="260" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Convex Voting Weight</text>
    <text x="605" y="280" font-size="11" font-style="italic" text-anchor="middle" fill="#1e293b">w_u = α T̄_u + β P̄_u (Eq. 3)</text>
    <text x="605" y="297" font-size="10.5" text-anchor="middle" fill="#15803d">α = 0.4, β = 0.6</text>

    <rect x="715" y="176" width="238" height="131" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.2"/>
    <text x="834" y="200" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">PoA Layer</text>
    <text x="834" y="222" font-size="11" text-anchor="middle" fill="#15803d">Admission: P_PoA(i) (Eq. 1)</text>
    <text x="834" y="247" font-size="11" font-weight="bold" text-anchor="middle" fill="#b91c1c">Ejection: 10000·B(u) ≥ 4359</text>
    <text x="834" y="263" font-size="10.5" text-anchor="middle" fill="#b91c1c">(Eq. 11)</text>
    <text x="834" y="288" font-size="11" text-anchor="middle" fill="#15803d">Slashing: (Eq. 12)</text>
  </g>

  <!-- ================= TIER 3 ================= -->
  <g id="tier3">
    <rect x="45" y="348" width="930" height="98" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="60" y="365" font-size="12" font-weight="bold" fill="#92400e">3. On-Chain Settlement</text>

    <rect x="60" y="374" width="215" height="62" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="167" y="394" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Aggregate Score</text>
    <text x="167" y="412" font-size="11.5" font-style="italic" text-anchor="middle" fill="#1e293b">V(p) (Eq. 4)</text>
    <text x="167" y="428" font-size="10" text-anchor="middle" fill="#78350f">token units</text>

    <rect x="285" y="374" width="245" height="62" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="407" y="392" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Treasury Allocation</text>
    <text x="407" y="410" font-size="10" font-style="italic" text-anchor="middle" fill="#1e293b">W(p) = V(p)(1-R(p))/R(p) (Eq. 13)</text>
    <text x="407" y="426" font-size="10" font-style="italic" text-anchor="middle" fill="#1e293b">A(p) = min(Ω_max·T_pool, λ*·W(p)) (Eq. 14)</text>

    <rect x="540" y="374" width="215" height="62" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="647" y="394" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Tranche Disbursement</text>
    <text x="647" y="412" font-size="11" font-style="italic" text-anchor="middle" fill="#1e293b">I(p,t) = A(p)·μ_t·S(p,t)</text>
    <text x="647" y="428" font-size="10.5" text-anchor="middle" fill="#78350f">Eq. (16)</text>

    <rect x="765" y="374" width="195" height="62" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="862" y="395" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">PoA Enforcement</text>
    <text x="862" y="413" font-size="10.5" text-anchor="middle" fill="#7f1d1d">eject and slash B_i</text>
    <text x="862" y="428" font-size="10" text-anchor="middle" fill="#b91c1c">Eqs. (11)–(12)</text>
  </g>

  <!-- ================= CONNECTING ARROWS ================= -->
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <line x1="167" y1="98" x2="167" y2="176" marker-end="url(#arr)"/>
    <line x1="397" y1="98" x2="372" y2="176" marker-end="url(#arr)"/>
    <line x1="627" y1="98" x2="605" y2="176" marker-end="url(#arr)"/>
    <line x1="855" y1="98" x2="834" y2="176" marker-end="url(#arr)"/>

    <line x1="605" y1="234" x2="605" y2="242" marker-end="url(#arr)"/>
    <path d="M 605 307 L 605 338 L 167 338 L 167 374" marker-end="url(#arr)"/>

    <line x1="275" y1="405" x2="285" y2="405" marker-end="url(#arr)"/>
    <line x1="530" y1="405" x2="540" y2="405" marker-end="url(#arr)"/>

    <!-- Attestation to Treasury Allocation -->
    <path d="M 270 307 L 270 348 L 407 348 L 407 374" marker-end="url(#arr)"/>
    
    <!-- PoA Layer to PoA Enforcement -->
    <line x1="834" y1="307" x2="834" y2="374" marker-end="url(#arr)"/>
  </g>

  <!-- Attested Label Box -->
  <g>
    <rect x="415" y="340" width="145" height="17" rx="3.5" fill="#ffffff" stroke="#d97706" stroke-width="0.9"/>
    <text x="487.5" y="352.5" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">Attested R(p), B(u) only</text>
  </g>
</svg>
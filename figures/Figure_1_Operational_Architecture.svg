    <line x1="389" y1="238" x2="389" y2="258" marker-end="url(#arrow)"/>
    <line x1="630" y1="238" x2="630" y2="258" marker-end="url(#arrow)"/>

    <path d="M 550 313 L 550 352 L 172 352 L 172 393" marker-end="url(#arrow)"/>
    <path d="M 820 313 L 820 358 L 240 358 L 240 393" marker-end="url(#arrow)"/>

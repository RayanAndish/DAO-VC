<svg id="lifecycle-svg" viewBox="0 0 1060 515" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- ================= TIER 1: PREPARATION & OFF-CHAIN INTELLIGENCE ================= -->
  <g id="tier1">
    <rect x="45" y="18" width="970" height="185" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="65" y="38" font-size="12.5" font-weight="bold" fill="#0369a1">Phase 1 &amp; 2: Initiation &amp; Off-Chain Intelligence</text>

    <rect x="65" y="52" width="280" height="135" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
    <text x="205" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Phase 1: Proposal Registration</text>
    <text x="205" y="104" font-size="11.5" text-anchor="middle" fill="#1e293b">Submit Capital Ask &amp; Features <tspan font-style="italic">X<tspan dy="3" font-size="8.5">p</tspan><tspan dy="-3"> ∈ ℝ⁶</tspan></tspan></text>
    <text x="205" y="126" font-size="11" text-anchor="middle" fill="#0369a1">(TAM, Burn, Milestones, Team)</text>
    <text x="205" y="152" font-size="11.5" text-anchor="middle" fill="#1e293b">Commit On-Chain Keccak-256 Hash</text>

    <rect x="390" y="52" width="280" height="135" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
    <text x="530" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Phase 2: Off-Chain AI Inference</text>
    <text x="530" y="104" font-size="11.5" text-anchor="middle" fill="#1e293b">Compute Risk <tspan font-style="italic">R(p)</tspan> via Venture DNN</text>
    <text x="530" y="124" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0369a1">Test ROC-AUC = 0.940</text>
    <text x="530" y="146" font-size="11.5" text-anchor="middle" fill="#1e293b">Compute Anomaly <tspan font-style="italic">B(u)</tspan> via Autoencoder</text>
    <text x="530" y="166" font-size="10.5" font-weight="600" text-anchor="middle" fill="#0369a1">Test ROC-AUC = 0.992</text>

    <rect x="715" y="52" width="280" height="135" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="855" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#78350f">Threshold Attestation Layer</text>
    <text x="855" y="104" font-size="11.5" text-anchor="middle" fill="#92400e">(<tspan font-style="italic">k-of-M</tspan>) ECDSA Committee Signatures</text>
    <text x="855" y="130" font-size="11.5" font-style="italic" text-anchor="middle" fill="#b45309">Commit Authentic ModelHash (Eq. 7)</text>
    <text x="855" y="154" font-size="10.5" text-anchor="middle" fill="#78350f"><tspan font-style="italic">Γ<tspan dy="3" font-size="8">p</tspan><tspan dy="-3"> = Keccak(PropID || R(p) || Epoch || ...)</tspan></tspan></text>
  </g>

  <!-- ================= TIER 2: ON-CHAIN GOVERNANCE & SETTLEMENT ================= -->
  <g id="tier2">
    <rect x="45" y="265" width="970" height="185" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="65" y="285" font-size="12.5" font-weight="bold" fill="#15803d">Phase 3 to 5: On-Chain Governance &amp; Settlement</text>

    <rect x="65" y="298" width="220" height="135" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="175" y="322" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Phase 3: Meritocratic Voting</text>
    <text x="175" y="348" font-size="11.5" font-weight="600" text-anchor="middle" fill="#14532d">Dual Voting Power (Eq. 4)</text>
    <text x="175" y="370" font-size="11.5" font-style="italic" text-anchor="middle" fill="#1f2937">w<tspan dy="3" font-size="8">u</tspan><tspan dy="-3"> = α T̄<tspan dy="3" font-size="8">u</tspan><tspan dy="-3"> + β P̄<tspan dy="3" font-size="8">u</tspan></tspan>  (β &gt; α)</tspan></text>
    <text x="175" y="398" font-size="11.5" text-anchor="middle" fill="#14532d">Quorum Gate: <tspan font-style="italic">V<tspan dy="3" font-size="8">share</tspan><tspan dy="-3">(p) ≥ θ</tspan></tspan></text>
    <text x="175" y="418" font-size="10.5" text-anchor="middle" fill="#166534">(Token Score: <tspan font-style="italic">V(p)</tspan>)</text>

    <rect x="310" y="298" width="220" height="135" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="420" y="322" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Phase 4: PoA Block Finality</text>
    <text x="420" y="348" font-size="11.5" text-anchor="middle" fill="#14532d">Validator Sequencing &amp;</text>
    <text x="420" y="368" font-size="11.5" text-anchor="middle" fill="#14532d">Deterministic Block Order</text>
    <text x="420" y="398" font-size="11" font-weight="bold" text-anchor="middle" fill="#991b1b">Slashing Escrow <tspan font-style="italic">B<tspan dy="2" font-size="8">i</tspan></tspan></text>
    <text x="420" y="418" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#dc2626">If <tspan font-style="italic">B(u) &gt; 0.65</tspan> → Slash &amp; Eject</text>

    <rect x="555" y="298" width="250" height="135" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <text x="680" y="322" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Phase 5: Contract Execution</text>
    <text x="680" y="346" font-size="11" font-weight="600" text-anchor="middle" fill="#78350f">Macro Allocation (Eq. 8):</text>
    <text x="680" y="366" font-size="11" font-style="italic" text-anchor="middle" fill="#92400e">A<tspan dy="3" font-size="8">target</tspan><tspan dy="-3">(p) ∝ V(p) × [(1 - R(p)) / R(p)]</tspan></text>
    <text x="680" y="392" font-size="11" font-weight="600" text-anchor="middle" fill="#78350f">Tranche Release (Eq. 9):</text>
    <text x="680" y="412" font-size="11" font-style="italic" text-anchor="middle" fill="#92400e">I(p,t) = A<tspan dy="3" font-size="8">target</tspan><tspan dy="-3">(p) × μ<tspan dy="3" font-size="8">t</tspan><tspan dy="-3"> × S(p,t)</tspan></tspan></text>

    <rect x="830" y="298" width="165" height="135" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.3"/>
    <text x="912" y="322" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">State Telemetry</text>
    <text x="912" y="340" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Stream</text>
    <text x="912" y="370" font-size="11" text-anchor="middle" fill="#713f12">Milestone Proofs</text>
    <text x="912" y="388" font-size="11" font-style="italic" text-anchor="middle" fill="#854d0e">S(p,t)</text>
    <text x="912" y="412" font-size="10.5" text-anchor="middle" fill="#713f12">Behavior Traces</text>
  </g>

  <!-- ================= INTERNAL INTRA-TIER ARROWS ================= -->
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <line x1="345" y1="119" x2="390" y2="119" marker-end="url(#arrow)"/>
    <line x1="670" y1="119" x2="715" y2="119" marker-end="url(#arrow)"/>

    <line x1="285" y1="365" x2="310" y2="365" marker-end="url(#arrow)"/>
    <line x1="530" y1="365" x2="555" y2="365" marker-end="url(#arrow)"/>
    <line x1="805" y1="365" x2="830" y2="365" marker-end="url(#arrow)"/>
  </g>

  <!-- ================= INTER-TIER TRANSITION ================= -->
  <g fill="none">
    <path d="M 855 187 L 855 235 L 175 235 L 175 298" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrow-amber)"/>
  </g>
  <g>
    <rect x="425" y="226" width="180" height="18" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="0.9"/>
    <text x="515" y="239" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">Attested Digest Ready (Γ<tspan dy="2" font-size="8">p</tspan><tspan dy="-2">)</tspan></text>
  </g>

  <!-- ================= CLOSED-LOOP FEEDBACK ================= -->
  <g fill="none">
    <path d="M 912 433 L 912 480 L 22 480 L 22 119 L 65 119" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-blue)"/>
  </g>
  <g>
    <rect x="330" y="471" width="370" height="18" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="0.9"/>
    <text x="515" y="484" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">↺ Closed-Loop AI Calibration &amp; Training Data Update</text>
  </g>
</svg>
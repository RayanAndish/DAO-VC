<svg id="aipox-fig4" viewBox="0 0 1060 480" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
  </defs>

  <!-- ================= TIER 1: PREPARATION & OFF-CHAIN INTELLIGENCE ================= -->
  <g id="tier1">
    <rect x="45" y="18" width="970" height="185" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="65" y="38" font-size="12.5" font-weight="bold" fill="#0369a1">Phases 1 and 2: Initiation and Off-Chain Analysis</text>

    <rect x="65" y="52" width="280" height="135" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
    <text x="205" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Phase 1: Proposal Registration</text>
    <text x="205" y="104" font-size="11.5" text-anchor="middle" fill="#1e293b">Submit funding ask and features</text>
    <text x="205" y="124" font-size="11.5" font-style="italic" text-anchor="middle" fill="#0369a1">X_p ∈ ℝ⁶ (six venture features)</text>
    <text x="205" y="150" font-size="11.5" text-anchor="middle" fill="#1e293b">Commit feature and proposal hash</text>
    <text x="205" y="170" font-size="11" text-anchor="middle" fill="#0284c7">Keccak-256 on-chain record</text>

    <rect x="390" y="52" width="280" height="135" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3"/>
    <text x="530" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Phase 2: Off-Chain AI Inference</text>
    <text x="530" y="104" font-size="11.5" text-anchor="middle" fill="#1e293b">Compute risk R(p) via venture DNN</text>
    <text x="530" y="124" font-size="11" font-weight="bold" text-anchor="middle" fill="#0284c7">Test ROC-AUC = 0.6394 (synthetic)</text>
    <text x="530" y="150" font-size="11.5" text-anchor="middle" fill="#1e293b">Compute anomaly B(u) via autoencoder</text>
    <text x="530" y="170" font-size="11" font-weight="bold" text-anchor="middle" fill="#0284c7">Test ROC-AUC = 1.0000 (simulated)</text>

    <rect x="715" y="52" width="280" height="135" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="855" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#78350f">Threshold Attestation</text>
    <text x="855" y="104" font-size="11.5" text-anchor="middle" fill="#92400e">k-of-M ECDSA committee, k = 4, M = 5</text>
    <text x="855" y="130" font-size="11.5" font-style="italic" text-anchor="middle" fill="#b45309">Digest Γ_p, Eq. (9)</text>
    <text x="855" y="154" font-size="11" text-anchor="middle" fill="#78350f">ModelHash approved on-chain</text>
  </g>

  <!-- ================= TIER 2: ON-CHAIN GOVERNANCE & SETTLEMENT ================= -->
  <g id="tier2">
    <rect x="45" y="265" width="970" height="185" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="65" y="285" font-size="12.5" font-weight="bold" fill="#15803d">Phases 3 to 5: On-Chain Governance and Settlement</text>

    <rect x="65" y="298" width="220" height="135" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="175" y="322" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Phase 3: Voting</text>
    <text x="175" y="348" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#14532d">Composite weight (Eq. 3)</text>
    <text x="175" y="370" font-size="11.5" font-style="italic" text-anchor="middle" fill="#1f2937">w_u = α T̄_u + β P̄_u</text>
    <text x="175" y="398" font-size="11" text-anchor="middle" fill="#14532d">one vote per voter per epoch</text>
    <text x="175" y="418" font-size="11" text-anchor="middle" fill="#166534">aggregate V(p) (Eq. 4)</text>

    <rect x="310" y="298" width="220" height="135" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="420" y="322" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Phase 4: PoA Block Validation</text>
    <text x="420" y="346" font-size="11" text-anchor="middle" fill="#14532d">Validator sequencing and</text>
    <text x="420" y="364" font-size="11" text-anchor="middle" fill="#14532d">deterministic block order</text>
    <text x="420" y="392" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#991b1b">Ejection: 10000·B(u) ≥ 4359</text>
    <text x="420" y="414" font-size="11" font-weight="bold" text-anchor="middle" fill="#dc2626">Eq. (11); slashing Eq. (12)</text>

    <rect x="555" y="298" width="250" height="135" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.3"/>
    <text x="680" y="322" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Phase 5: Contract Execution</text>
    <text x="680" y="344" font-size="11" font-weight="600" text-anchor="middle" fill="#78350f">Treasury allocation (Eqs. 13–15)</text>
    <text x="680" y="362" font-size="10" font-style="italic" text-anchor="middle" fill="#92400e">W(p) = V(p)(1-R(p))/R(p)</text>
    <text x="680" y="378" font-size="10" font-style="italic" text-anchor="middle" fill="#92400e">A(p) = min(Ω_max·T_pool, λ*·W(p))</text>
    <text x="680" y="402" font-size="11" font-weight="600" text-anchor="middle" fill="#78350f">Tranche release (Eq. 16)</text>
    <text x="680" y="420" font-size="10.5" font-style="italic" text-anchor="middle" fill="#92400e">I(p,t) = A(p)·μ_t·S(p,t)</text>

    <rect x="830" y="298" width="165" height="135" rx="5" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,3"/>
    <text x="912" y="322" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Milestone Oracle</text>
    <text x="912" y="352" font-size="11.5" font-style="italic" text-anchor="middle" fill="#1e293b">S(p,t) ∈ [0,1]</text>
    <text x="912" y="385" font-size="11" text-anchor="middle" fill="#475569">specified, not</text>
    <text x="912" y="403" font-size="11" text-anchor="middle" fill="#475569">evaluated</text>
  </g>

  <!-- ================= ARROWS ================= -->
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <line x1="345" y1="119" x2="390" y2="119" marker-end="url(#arr)"/>
    <line x1="670" y1="119" x2="715" y2="119" marker-end="url(#arr)"/>

    <line x1="285" y1="365" x2="310" y2="365" marker-end="url(#arr)"/>
    <line x1="530" y1="365" x2="555" y2="365" marker-end="url(#arr)"/>
    <line x1="805" y1="365" x2="830" y2="365" marker-end="url(#arr)"/>
  </g>

  <!-- Inter-Tier Transition (Attestation to Phase 3) -->
  <g fill="none">
    <path d="M 855 187 L 855 235 L 175 235 L 175 298" stroke="#d97706" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  </g>
  <g>
    <rect x="405" y="226" width="180" height="18" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="0.9"/>
    <text x="495" y="239" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">Attested digest Γ_p ready</text>
  </g>
</svg>
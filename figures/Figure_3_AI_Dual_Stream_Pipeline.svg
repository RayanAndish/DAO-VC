<svg id="pipeline-svg" viewBox="0 0 1020 550" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#4f46e5" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
  </defs>

  <!-- ================= STAGE 1 ================= -->
  <g id="stage1">
    <rect x="40" y="15" width="940" height="86" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.3" stroke-dasharray="5,4"/>
    <text x="55" y="32" font-size="12" font-weight="bold" fill="#7e22ce">1. Telemetry Ingestion &amp; Feature Extraction</text>

    <rect x="55" y="38" width="440" height="55" rx="4" fill="#fae8ff" stroke="#9333ea" stroke-width="1.2"/>
    <text x="275" y="55" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Node Operational Telemetry</text>
    <text x="275" y="71" font-size="12" font-style="italic" text-anchor="middle" fill="#3b0764">z<tspan dy="3" font-size="9">u</tspan><tspan dy="-3"> ∈ ℝ³</tspan></text>
    <text x="275" y="85" font-size="10.5" text-anchor="middle" fill="#581c87">(Txs, Native Balance, Gas Used)</text>

    <rect x="525" y="38" width="440" height="55" rx="4" fill="#fae8ff" stroke="#9333ea" stroke-width="1.2"/>
    <text x="745" y="55" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Venture Attributes</text>
    <text x="745" y="71" font-size="12" font-style="italic" text-anchor="middle" fill="#3b0764">X<tspan dy="3" font-size="9">p</tspan><tspan dy="-3"> ∈ ℝ⁶</tspan></text>
    <text x="745" y="85" font-size="10.5" text-anchor="middle" fill="#581c87">(TAM, Burn, Ask, Milestones, Experience)</text>
  </g>

  <!-- ================= STAGE 2 ================= -->
  <g id="stage2">
    <rect x="40" y="118" width="940" height="86" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.3"/>
    <text x="55" y="135" font-size="12" font-weight="bold" fill="#0f766e">2. Pre-Inference Defense &amp; Provenance Trimming</text>

    <rect x="55" y="141" width="440" height="55" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
    <text x="275" y="159" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Statistical IQR Filter <tspan font-weight="normal">(Eq. 15)</tspan></text>
    <text x="275" y="176" font-size="12" font-style="italic" text-anchor="middle" fill="#134e4a">|z<tspan dy="2" font-size="8">u</tspan><tspan dy="-2"> - median(z</tspan><tspan dy="2" font-size="8">u</tspan><tspan dy="-2">)| ≤ 1.5 × IQR(z</tspan><tspan dy="2" font-size="8">u</tspan><tspan dy="-2">)</tspan></text>
    <text x="275" y="190" font-size="10" text-anchor="middle" fill="#115e59">(Telemetry Outlier Sanitization)</text>

    <rect x="525" y="141" width="440" height="55" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
    <text x="745" y="161" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">On-Chain Provenance Verification</text>
    <text x="745" y="181" font-size="11.5" text-anchor="middle" fill="#115e59">Immutable Storage &amp; Hash Integrity Check for Features</text>
  </g>

  <!-- ================= STAGE 3 ================= -->
  <g id="stage3">
    <rect x="40" y="221" width="940" height="96" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="55" y="238" font-size="12" font-weight="bold" fill="#b45309">3. Dual-Stream Off-Chain Neural Inference</text>

    <rect x="55" y="244" width="440" height="65" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="275" y="262" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Unsupervised Autoencoder <tspan font-size="11" font-weight="normal">(3→16→4→16→3)</tspan></text>
    <text x="275" y="281" font-size="12" font-style="italic" text-anchor="middle" fill="#78350f">Anomaly Score: B(u) ∈ [0, 1]</text>
    <text x="275" y="299" font-size="11" font-weight="600" text-anchor="middle" fill="#b45309">Held-out Test ROC-AUC = 0.992</text>

    <rect x="525" y="244" width="440" height="65" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="745" y="262" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Venture Risk DNN <tspan font-size="11" font-weight="normal">(6→32→16→1)</tspan></text>
    <text x="745" y="281" font-size="12" font-style="italic" text-anchor="middle" fill="#78350f">Default Risk: R(p) ∈ (0, 1)</text>
    <text x="745" y="299" font-size="11" font-weight="600" text-anchor="middle" fill="#b45309">Held-out Test ROC-AUC = 0.940</text>
  </g>

  <!-- ================= STAGE 4 ================= -->
  <g id="stage4">
    <rect x="40" y="334" width="940" height="78" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
    <text x="55" y="350" font-size="12" font-weight="bold" fill="#15803d">4. Cryptographic Threshold Attestation</text>

    <rect x="160" y="354" width="700" height="50" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="1.3"/>
    <text x="510" y="372" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">(k-of-M) Threshold Attestation Digest <tspan font-weight="normal">(Eq. 7)</tspan></text>
    <text x="510" y="392" font-size="11.5" font-style="italic" text-anchor="middle" fill="#14532d">Γ<tspan dy="3" font-size="8">p</tspan><tspan dy="-3"> = Keccak(ProposalID || R(p) || Epoch || Nonce || ModelHash)</tspan></text>
  </g>

  <!-- ================= STAGE 5 ================= -->
  <g id="stage5">
    <rect x="40" y="430" width="940" height="104" rx="6" fill="#faf5ff" stroke="#6366f1" stroke-width="1.3" stroke-dasharray="5,4"/>
    <text x="55" y="447" font-size="12" font-weight="bold" fill="#4338ca">5. Deterministic On-Chain Enforcement</text>

    <rect x="55" y="453" width="410" height="73" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="260" y="473" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#991b1b">PoA Slashing &amp; Quarantine <tspan font-weight="normal">(Eq. 11)</tspan></text>
    <text x="260" y="493" font-size="12" font-style="italic" font-weight="bold" text-anchor="middle" fill="#7f1d1d">If B(u) &gt; 0.65 → Eject &amp; Slash B<tspan dy="2" font-size="8">i</tspan></text>
    <text x="260" y="512" font-size="10.5" text-anchor="middle" fill="#b91c1c">(Validator Stake Quarantine Enforcement)</text>

    <rect x="495" y="453" width="470" height="73" rx="4" fill="#ede9fe" stroke="#4f46e5" stroke-width="1.3"/>
    <text x="730" y="473" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#312e81">Bayesian Odds Allocation <tspan font-weight="normal">(Eq. 8 &amp; 9)</tspan></text>
    <text x="730" y="493" font-size="11.5" font-style="italic" text-anchor="middle" fill="#3730a3">A<tspan dy="3" font-size="8">target</tspan><tspan dy="-3">(p) ∝ V(p) × [(1 - R(p)) / R(p)]</tspan></text>
    <text x="730" y="512" font-size="11.5" font-style="italic" text-anchor="middle" fill="#4338ca">Milestone Release: I(p,t) = A<tspan dy="3" font-size="8">target</tspan><tspan dy="-3"> × μ</tspan><tspan dy="3" font-size="8">t</tspan><tspan dy="-3"> × S(p,t)</tspan></text>
  </g>

  <!-- ================= DIRECT CONNECTING ARROWS ================= -->
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <line x1="275" y1="93" x2="275" y2="141" marker-end="url(#arrow)"/>
    <line x1="275" y1="196" x2="275" y2="244" marker-end="url(#arrow)"/>

    <line x1="745" y1="93" x2="745" y2="141" marker-end="url(#arrow)"/>
    <line x1="745" y1="196" x2="745" y2="244" marker-end="url(#arrow)"/>

    <path d="M 275 309 L 275 328 L 360 328 L 360 354" marker-end="url(#arrow)"/>
    <path d="M 745 309 L 745 328 L 660 328 L 660 354" marker-end="url(#arrow)"/>

    <path d="M 330 404 L 330 426 L 260 426 L 260 453" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <path d="M 690 404 L 690 426 L 730 426 L 730 453" stroke="#4f46e5" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  </g>

  <!-- ================= ARROW LABELS ================= -->
  <g font-size="10.5" font-weight="bold">
    <rect x="235" y="418" width="115" height="17" rx="3.5" fill="#ffffff" stroke="#dc2626" stroke-width="0.9"/>
    <text x="292.5" y="430.5" fill="#dc2626" text-anchor="middle">Verified B(u)</text>

    <rect x="660" y="418" width="115" height="17" rx="3.5" fill="#ffffff" stroke="#4f46e5" stroke-width="0.9"/>
    <text x="717.5" y="430.5" fill="#4f46e5" text-anchor="middle">Attested R(p)</text>
  </g>
</svg>
<svg id="aipox-fig3" viewBox="0 0 1020 540" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb" />
    </marker>
  </defs>

  <!-- ================= STAGE 1 ================= -->
  <g id="stage1">
    <rect x="40" y="15" width="940" height="82" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="1.3" stroke-dasharray="5,4"/>
    <text x="55" y="31" font-size="11.5" font-weight="bold" fill="#7e22ce">1. Telemetry Ingestion and Feature Extraction</text>

    <rect x="55" y="38" width="440" height="52" rx="4" fill="#fae8ff" stroke="#9333ea" stroke-width="1.2"/>
    <text x="275" y="54" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Node Operational Telemetry</text>
    <text x="275" y="70" font-size="11.5" font-style="italic" text-anchor="middle" fill="#3b0764">z_u ∈ ℝ⁸</text>
    <text x="275" y="83" font-size="9.5" text-anchor="middle" fill="#581c87">log tx count, balance, log gas, log latency, entropy, drop ratio, clustering, uptime</text>

    <rect x="525" y="38" width="440" height="52" rx="4" fill="#fae8ff" stroke="#9333ea" stroke-width="1.2"/>
    <text x="745" y="54" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Venture Attributes</text>
    <text x="745" y="70" font-size="11.5" font-style="italic" text-anchor="middle" fill="#3b0764">X_p ∈ ℝ⁶</text>
    <text x="745" y="83" font-size="9.5" text-anchor="middle" fill="#581c87">burn rate, requested amount, milestones, team experience, prior funding, TAM</text>
  </g>

  <!-- ================= STAGE 2 ================= -->
  <g id="stage2">
    <rect x="40" y="112" width="940" height="80" rx="6" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.3"/>
    <text x="55" y="128" font-size="11.5" font-weight="bold" fill="#0f766e">2. Peer Filtering and Feature Commitment</text>

    <rect x="55" y="134" width="440" height="52" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2" stroke-dasharray="4,3"/>
    <text x="275" y="152" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Peer-Median Filter (Eq. 24)</text>
    <text x="275" y="167" font-size="11" font-style="italic" text-anchor="middle" fill="#134e4a">median over N_peers of |z - median(z)| ≤ 1.5·IQR</text>
    <text x="275" y="180" font-size="9.5" font-weight="600" text-anchor="middle" fill="#0d9488">specified, not evaluated</text>

    <rect x="525" y="134" width="440" height="52" rx="4" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.2"/>
    <text x="745" y="154" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Feature Commitment</text>
    <text x="745" y="172" font-size="11" text-anchor="middle" fill="#115e59">Keccak-256 hash of X_p committed in Phase 2</text>
  </g>

  <!-- ================= STAGE 3 ================= -->
  <g id="stage3">
    <rect x="40" y="206" width="940" height="92" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="55" y="222" font-size="11.5" font-weight="bold" fill="#b45309">3. Off-Chain Neural Inference</text>

    <rect x="55" y="228" width="440" height="62" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="275" y="246" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Telemetry Autoencoder <tspan font-size="11" font-weight="normal">(8→16→4→16→8)</tspan></text>
    <text x="275" y="264" font-size="11.5" font-style="italic" text-anchor="middle" fill="#78350f">Anomaly score B(u) ∈ [0, 1]</text>
    <text x="275" y="281" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#b45309">Test ROC-AUC = 1.0000 (simulated)</text>

    <rect x="525" y="228" width="440" height="62" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
    <text x="745" y="246" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Venture Risk DNN <tspan font-size="11" font-weight="normal">(6→32→16→1)</tspan></text>
    <text x="745" y="264" font-size="11.5" font-style="italic" text-anchor="middle" fill="#78350f">Default probability R(p) ∈ (0, 1)</text>
    <text x="745" y="281" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#b45309">Test ROC-AUC = 0.6394 (synthetic cohort)</text>
  </g>

  <!-- ================= STAGE 4 ================= -->
  <g id="stage4">
    <rect x="40" y="312" width="940" height="72" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
    <text x="55" y="328" font-size="11.5" font-weight="bold" fill="#15803d">4. Cryptographic Threshold Attestation</text>

    <rect x="160" y="332" width="700" height="46" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3"/>
    <text x="510" y="350" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">(k-of-M) Threshold Attestation Digest <tspan font-weight="normal">(Eq. 9)</tspan></text>
    <text x="510" y="367" font-size="10.5" font-style="italic" text-anchor="middle" fill="#14532d">Γ_p = Keccak-256(contract || chainId || pid || epoch || nonce || ModelHash || riskScaled)</text>
  </g>

  <!-- ================= STAGE 5 ================= -->
  <g id="stage5">
    <rect x="40" y="400" width="940" height="106" rx="6" fill="#faf5ff" stroke="#6366f1" stroke-width="1.3" stroke-dasharray="5,4"/>
    <text x="55" y="416" font-size="11.5" font-weight="bold" fill="#4338ca">5. On-Chain Enforcement</text>

    <rect x="55" y="424" width="410" height="74" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3"/>
    <text x="260" y="443" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Ejection and Slashing <tspan font-weight="normal">(Eqs. 11–12)</tspan></text>
    <text x="260" y="462" font-size="11" font-style="italic" font-weight="bold" text-anchor="middle" fill="#7f1d1d">10000·B(u) ≥ 4359 ⇒ eject; B_i^new = (1 - B(u))·B_i^old</text>
    <text x="260" y="481" font-size="10" text-anchor="middle" fill="#b91c1c">applied only when B(u) ≥ τ = 0.435854</text>

    <rect x="495" y="424" width="470" height="74" rx="4" fill="#ede9fe" stroke="#4f46e5" stroke-width="1.3"/>
    <text x="730" y="443" font-size="12" font-weight="bold" text-anchor="middle" fill="#312e81">Risk-Odds Allocation <tspan font-weight="normal">(Eqs. 13–16)</tspan></text>
    <text x="730" y="462" font-size="10.5" font-style="italic" text-anchor="middle" fill="#3730a3">W(p) = V(p)(1-R(p))/R(p); A(p) = min(Ω_max·T_pool, λ*·W(p))</text>
    <text x="730" y="481" font-size="10.5" font-style="italic" text-anchor="middle" fill="#4338ca">Tranche: I(p,t) = A(p)·μ_t·S(p,t)</text>
  </g>

  <!-- ================= CONNECTING ARROWS ================= -->
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <line x1="275" y1="90" x2="275" y2="134" marker-end="url(#arr)"/>
    <line x1="275" y1="186" x2="275" y2="228" marker-end="url(#arr)"/>

    <line x1="745" y1="90" x2="745" y2="134" marker-end="url(#arr)"/>
    <line x1="745" y1="186" x2="745" y2="228" marker-end="url(#arr)"/>

    <path d="M 275 290 L 275 310 L 360 310 L 360 332" marker-end="url(#arr)"/>
    <path d="M 745 290 L 745 310 L 660 310 L 660 332" marker-end="url(#arr)"/>

    <path d="M 350 378 L 350 398 L 260 398 L 260 424" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <path d="M 670 378 L 670 398 L 730 398 L 730 424" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  </g>

  <!-- Labels on Stage 4->5 arrows -->
  <g font-size="10.5" font-weight="bold">
    <rect x="235" y="390" width="115" height="17" rx="3.5" fill="#ffffff" stroke="#dc2626" stroke-width="0.9"/>
    <text x="292.5" y="402.5" fill="#dc2626" text-anchor="middle">Verified B(u)</text>

    <rect x="660" y="390" width="115" height="17" rx="3.5" fill="#ffffff" stroke="#2563eb" stroke-width="0.9"/>
    <text x="717.5" y="402.5" fill="#2563eb" text-anchor="middle">Attested R(p)</text>
  </g>
</svg>